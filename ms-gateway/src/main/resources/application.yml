server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      routes:
        - id: ms-event-catalog-service
          uri: lb://ms-event-catalog-service
          predicates:
            - Path=/api/v1/catalog/**
        - id: ms-user-service
          uri: lb://ms-user-service
          predicates:
            - Path=/api/v1/auth/**
        - id: ms-reservation-service
          uri: lb://ms-reservation-service
          predicates:
            - Path=/api/v1/reservation/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
